<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F11"/>
      <stop offset="50%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#2D0A0A"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Dark Premium Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Red Accent Glow Arc -->
  <path d="M -100 630 Q 300 300 1300 630 Z" fill="#DC2626" opacity="0.25"/>
  <rect x="0" y="615" width="1200" height="15" fill="url(#redGlow)"/>

  <!-- Logo Header -->
  <g transform="translate(80, 70)">
    <!-- Red Logo Mark 'B' -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#DC2626"/>
    <text x="35" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, sans-serif" font-size="42" font-weight="bold">B</text>
    
    <!-- Brand Title -->
    <text x="95" y="38" fill="#FFFFFF" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" letter-spacing="2">BAZMA</text>
    <text x="95" y="62" fill="#EF4444" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="4">IMPORT AND EXPORT NIG LTD</text>
  </g>

  <!-- Pill Tagline Badge -->
  <g transform="translate(80, 185)">
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#DC2626"/>
    <text x="170" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1">ORIGINAL • TRUSTED • GLOBAL</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="300" fill="#FFFFFF" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="bold">Genuine Apple iPhones</text>
  <text x="80" y="365" fill="#EF4444" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="bold">Direct From China 🇨🇳 ➔ 🇳🇬</text>

  <!-- Slogan -->
  <text x="80" y="435" fill="#E5E7EB" font-family="Georgia, serif" font-size="28" font-style="italic">"More Than Just Phones... We Deliver Trust"</text>

  <!-- Contact Bar Footer -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="1040" height="65" rx="16" fill="#18181C" stroke="#33333C" stroke-width="2"/>
    
    <!-- Phone NG -->
    <text x="40" y="38" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🇳🇬 Nigeria: <tspan fill="#EF4444">+234 806 956 8916</tspan></text>
    
    <!-- Divider -->
    <circle cx="390" cy="32" r="4" fill="#555560"/>
    
    <!-- Phone CN -->
    <text x="420" y="38" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🇨🇳 China: <tspan fill="#EF4444">+86 150 0982 3932</tspan></text>

    <!-- Location Badge -->
    <rect x="760" y="12" width="250" height="41" rx="10" fill="#DC2626"/>
    <text x="885" y="38" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Maiduguri HQ • Founded 2024</text>
  </g>
</svg>
